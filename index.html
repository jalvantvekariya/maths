<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waveform | Notebook Visualization</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper-bg: #F7F3E8;
            --paper-line: rgba(140, 165, 195, 0.22);
            --margin-line: rgba(230, 110, 120, 0.38);
            --ink-main: #1C2434;
            --ink-blue: #2B4C7E;
            --ink-pink: #E85D75;
            --ink-purple: #5A4099;
            --ink-subtle: #6C7A89;
            
            --font-hand: 'Caveat', cursive;
            --font-print-hand: 'Patrick Hand', cursive;
            --font-math: 'Lora', Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--paper-bg);
            color: var(--ink-main);
            font-family: var(--font-hand);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* REALISTIC RULED NOTEBOOK BACKGROUND */
        .notebook-paper {
            min-height: 100vh;
            width: 100%;
            position: relative;
            background-color: var(--paper-bg);
            background-image: 
                repeating-linear-gradient(
                    transparent,
                    transparent 29px,
                    var(--paper-line) 29px,
                    var(--paper-line) 30px
                );
            background-attachment: local;
            padding: 2.5rem 2rem 4rem 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* RED MARGIN LINE */
        .notebook-paper::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3.75rem;
            width: 2px;
            background-color: var(--margin-line);
            pointer-events: none;
        }

        /* PAGE CONTENT WRAPPER */
        .content-container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* HEADER SECTION */
        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 2rem;
            position: relative;
        }

        .title-group {
            position: relative;
            display: inline-block;
        }

        h1.notebook-title {
            font-family: var(--font-hand);
            font-size: 3.2rem;
            font-weight: 700;
            color: var(--ink-blue);
            line-height: 1;
            letter-spacing: 0.04em;
            transform: rotate(-1deg);
        }

        .notebook-subtitle {
            font-family: var(--font-print-hand);
            font-size: 1.25rem;
            color: var(--ink-subtle);
            margin-top: 0.2rem;
            margin-left: 0.2rem;
        }

        /* HAND-DRAWN UNDERLINE SVG */
        .title-underline {
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 12px;
            overflow: visible;
        }

        /* EQUATION SECTION */
        .equation-area {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .main-equation {
            font-family: var(--font-math);
            font-size: 1.85rem;
            color: var(--ink-main);
            margin-bottom: 0.3rem;
            letter-spacing: 0.02em;
        }

        .main-equation span.k-var {
            color: var(--ink-pink);
            font-weight: 600;
            font-style: italic;
        }

        .domain-note {
            font-family: var(--font-hand);
            font-size: 1.4rem;
            color: var(--ink-blue);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* GRAPH & ANNOTATIONS CONTAINER */
        .graph-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        /* CANVAS STYLING */
        canvas {
            display: block;
            background: transparent;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* SVG OVERLAY FOR ANNOTATIONS & HAND-DRAWN ARROWS */
        .annotations-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* ANNOTATION TEXT PLACEMENT */
        .annotation {
            position: absolute;
            font-family: var(--font-hand);
            font-size: 1.35rem;
            color: var(--ink-blue);
            pointer-events: none;
            line-height: 1.1;
        }

        .note-freq {
            top: 15px;
            right: 40px;
            transform: rotate(3deg);
            color: var(--ink-purple);
        }

        .note-waves {
            bottom: 80px;
            left: 20px;
            transform: rotate(-4deg);
            color: var(--ink-pink);
        }

        .note-heart {
            top: 55px;
            left: 50px;
            transform: rotate(-2deg);
        }

        /* ECG HEARTBEAT FLOURISH */
        .ecg-line {
            position: absolute;
            bottom: 20px;
            right: 35px;
            pointer-events: none;
            opacity: 0.85;
        }

        /* CENTERED CONTROL SECTION */
        .control-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .k-input-container {
            font-family: var(--font-math);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--ink-main);
        }

        .k-label {
            font-style: italic;
            color: var(--ink-pink);
            font-weight: 500;
        }

        .k-input {
            font-family: var(--font-print-hand);
            font-size: 1.8rem;
            color: var(--ink-blue);
            background: transparent;
            border: none;
            border-bottom: 2px stroke var(--ink-blue);
            outline: none;
            width: 110px;
            text-align: center;
            padding-bottom: 2px;
            border-bottom: 2px dashed rgba(43, 76, 126, 0.4);
            transition: border-color 0.2s;
        }

        .k-input:focus {
            border-bottom-color: var(--ink-pink);
        }

        /* PLAY / PAUSE BUTTONS */
        .playback-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-top: 0.4rem;
        }

        .btn-handwritten {
            background: none;
            border: none;
            font-family: var(--font-hand);
            font-size: 1.4rem;
            color: var(--ink-subtle);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: color 0.2s, transform 0.1s;
        }

        .btn-handwritten:hover {
            color: var(--ink-blue);
            transform: scale(1.05);
        }

        .btn-handwritten.active {
            color: var(--ink-pink);
            font-weight: 700;
        }

        /* NOTEBOOK STATUS READOUT */
        .status-summary {
            font-family: var(--font-print-hand);
            font-size: 1.15rem;
            color: var(--ink-subtle);
            text-align: center;
            margin-top: 0.6rem;
            line-height: 1.4;
        }

        .status-summary span {
            color: var(--ink-main);
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            .notebook-paper {
                padding: 1.5rem 1rem 3rem 2.8rem;
            }
            .notebook-paper::before {
                left: 2rem;
            }
            h1.notebook-title {
                font-size: 2.5rem;
            }
            .main-equation {
                font-size: 1.35rem;
            }
            .annotation {
                display: none; /* Hide heavy annotations on tiny screens */
            }
        }
    </style>
</head>
<body>

    <div class="notebook-paper">
        <div class="content-container">
            
            <header>
                <div class="title-group">
                    <h1 class="notebook-title">WAVEFORM</h1>
                    <svg class="title-underline" viewBox="0 0 200 12" preserveAspectRatio="none">
                        <path d="M 3,7 Q 55,2 105,8 T 197,5" fill="none" stroke="#2B4C7E" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="notebook-subtitle">mathematical visualization</div>
            </header>

            <div class="equation-area">
                <div class="main-equation">
                    y = |x|²⁄³ + 0.9 sin(<span class="k-var" id="eqK">0</span>x) √(3 − x²)
                </div>
                <div class="domain-note">
                    domain: −√3 ≤ x ≤ √3
                </div>
            </div>

            <div class="graph-wrapper" id="graphWrapper">
                <canvas id="graphCanvas"></canvas>

                <svg class="annotations-svg" id="annotationsSvg">
                    <path d="M 580,35 Q 550,60 510,75" fill="none" stroke="#5A4099" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>
                    <path d="M 110,105 Q 160,110 200,135" fill="none" stroke="#2B4C7E" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
                    <path d="M 120,330 Q 150,310 180,320" fill="none" stroke="#E85D75" stroke-width="1.8" marker-end="url(#arrow-pink)"/>

                    <defs>
                        <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#5A4099" />
                        </marker>
                        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2B4C7E" />
                        </marker>
                        <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#E85D75" />
                        </marker>
                    </defs>
                </svg>

                <div class="annotation note-freq">k controls frequency ⚡</div>
                <div class="annotation note-heart">curious heart envelope</div>
                <div class="annotation note-waves">more k → more waves!</div>

                <svg class="ecg-line" width="140" height="30" viewBox="0 0 140 30">
                    <path d="M 5,15 L 35,15 L 42,5 L 48,25 L 55,10 L 62,20 L 67,15 L 135,15" fill="none" stroke="#E85D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="control-section">
                <div class="k-input-container">
                    <span class="k-label">k =</span>
                    <input type="text" id="kInput" class="k-input" value="0" placeholder="0 - 150" autocomplete="off" spellcheck="false">
                </div>

                <div class="playback-controls">
                    <button class="btn-handwritten" id="playBtn">▶ play</button>
                    <button class="btn-handwritten active" id="pauseBtn">Ⅱ pause</button>
                    <button class="btn-handwritten" id="resetBtn">↺ reset view</button>
                </div>

                <div class="status-summary">
                    k = <span id="readoutK">0.00</span> &nbsp;|&nbsp; 
                    domain: <span>[-1.732, 1.732]</span> &nbsp;|&nbsp; 
                    state: <span id="readoutState">ready</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM Elements
            const canvas = document.getElementById('graphCanvas');
            const ctx = canvas.getContext('2d');
            const graphWrapper = document.getElementById('graphWrapper');
            const kInput = document.getElementById('kInput');
            const eqK = document.getElementById('eqK');
            const readoutK = document.getElementById('readoutK');
            const readoutState = document.getElementById('readoutState');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');

            // Math Constants
            const SQRT_3 = Math.sqrt(3);
            const K_MIN = 0;
            const K_MAX = 150;

            // State
            let currentK = 0.0;
            let targetK = 0.0;
            let isAnimatingMode = false;
            let animDirection = 1;

            // Viewport Framing
            let scaleX = 1.0;
            let scaleY = 1.0;
            let panX = 0.0;
            let panY = 0.75;
            let basePixelsPerUnit = 180;

            // Drag State
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            let panStartX = 0, panStartY = 0;

            function init() {
                setupEventListeners();
                handleResize();
                resetView();
                requestAnimationFrame(loop);
            }

            function resetView() {
                panX = 0.0;
                panY = 0.75;
                scaleX = 1.0;
                scaleY = 1.0;
            }

            function handleResize() {
                const rect = graphWrapper.getBoundingClientRect();
                const width = Math.min(rect.width, 820);
                const height = 440;

                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;

                ctx.scale(dpr, dpr);
                basePixelsPerUnit = Math.min(width, height) / 3.8;
            }

            function mathToScreen(x, y) {
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;
                const centerX = width / 2;
                const centerY = height / 2;

                const screenX = centerX + (x - panX) * (basePixelsPerUnit * scaleX);
                const screenY = centerY - (y - panY) * (basePixelsPerUnit * scaleY);
                return { x: screenX, y: screenY };
            }

            function evaluateFunction(x, k) {
                const absX = Math.abs(x);
                const term1 = Math.pow(absX, 2 / 3);
                const rad = Math.max(0, 3 - x * x);
                const term2 = 0.9 * Math.sin(k * x) * Math.sqrt(rad);
                return term1 + term2;
            }

            function setupEventListeners() {
                window.addEventListener('resize', handleResize);

                // K Input Handling
                kInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        validateAndApplyInput();
                        kInput.blur();
                    }
                });

                kInput.addEventListener('blur', validateAndApplyInput);

                // Play / Pause / Reset
                playBtn.addEventListener('click', () => setAnimationMode(true));
                pauseBtn.addEventListener('click', () => setAnimationMode(false));
                resetBtn.addEventListener('click', resetView);

                // Pan / Dragging
                canvas.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    panStartX = panX;
                    panStartY = panY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - dragStartX;
                    const dy = e.clientY - dragStartY;
                    const unitX = basePixelsPerUnit * scaleX;
                    const unitY = basePixelsPerUnit * scaleY;

                    panX = panStartX - dx / unitX;
                    panY = panStartY + dy / unitY;
                });

                window.addEventListener('mouseup', () => { isDragging = false; });

                // Zoom (Mouse Wheel)
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoom = e.deltaY < 0 ? 1.06 : 0.94;
                    scaleX = Math.max(0.4, Math.min(10, scaleX * zoom));
                    scaleY = Math.max(0.4, Math.min(10, scaleY * zoom));
                }, { passive: false });
            }

            function validateAndApplyInput() {
                let parsed = parseFloat(kInput.value);
                if (isNaN(parsed) || !isFinite(parsed)) {
                    parsed = targetK;
                }
                parsed = Math.max(K_MIN, Math.min(K_MAX, parsed));
                targetK = parsed;
                if (isAnimatingMode) setAnimationMode(false);
            }

            function setAnimationMode(active) {
                isAnimatingMode = active;
                if (active) {
                    playBtn.classList.add('active');
                    pauseBtn.classList.remove('active');
                } else {
                    pauseBtn.classList.add('active');
                    playBtn.classList.remove('active');
                    targetK = currentK;
                }
            }

            function formatNum(n) {
                return Math.abs(n - Math.round(n)) < 0.001 ? Math.round(n).toString() : n.toFixed(2);
            }

            function loop() {
                update();
                render();
                requestAnimationFrame(loop);
            }

            function update() {
                if (isAnimatingMode) {
                    targetK += 0.12 * animDirection;
                    if (targetK >= K_MAX) { targetK = K_MAX; animDirection = -1; }
                    else if (targetK <= K_MIN) { targetK = K_MIN; animDirection = 1; }
                }

                // Smooth Morph Interpolation
                const diff = targetK - currentK;
                if (Math.abs(diff) > 0.0001) {
                    currentK += diff * 0.08;
                } else {
                    currentK = targetK;
                }

                const formatted = formatNum(currentK);
                eqK.textContent = formatted;
                readoutK.textContent = currentK.toFixed(2);

                if (document.activeElement !== kInput && !isAnimatingMode) {
                    kInput.value = formatted;
                }

                if (isAnimatingMode) {
                    readoutState.textContent = 'animating...';
                } else if (Math.abs(targetK - currentK) > 0.01) {
                    readoutState.textContent = 'morphing';
                } else {
                    readoutState.textContent = currentK === 0 ? 'ready' : 'stable';
                }
            }

            function render() {
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;

                ctx.clearRect(0, 0, width, height);

                drawNotebookAxes(width, height);
                drawInkWaveform();
            }

            // HAND-DRAWN STYLE AXES & GRID
            function drawNotebookAxes(width, height) {
                ctx.save();

                const pxPerUnitX = basePixelsPerUnit * scaleX;
                const pxPerUnitY = basePixelsPerUnit * scaleY;

                const minMathX = panX - (width / 2) / pxPerUnitX;
                const maxMathX = panX + (width / 2) / pxPerUnitX;
                const minMathY = panY - (height / 2) / pxPerUnitY;
                const maxMathY = panY + (height / 2) / pxPerUnitY;

                let step = 0.5;
                if (pxPerUnitX < 80) step = 1.0;

                // Faint Pencil Grid
                ctx.strokeStyle = "rgba(43, 76, 126, 0.06)";
                ctx.lineWidth = 1;

                const firstX = Math.floor(minMathX / step) * step;
                for (let x = firstX; x <= maxMathX; x += step) {
                    const pt = mathToScreen(x, 0);
                    ctx.beginPath();
                    ctx.moveTo(pt.x, 0);
                    ctx.lineTo(pt.x, height);
                    ctx.stroke();
                }

                const firstY = Math.floor(minMathY / step) * step;
                for (let y = firstY; y <= maxMathY; y += step) {
                    const pt = mathToScreen(0, y);
                    ctx.beginPath();
                    ctx.moveTo(0, pt.y);
                    ctx.lineTo(width, pt.y);
                    ctx.stroke();
                }

                // Main Axes (Organic Hand-Drawn Blue Ink Pen Strokes)
                const origin = mathToScreen(0, 0);
                ctx.strokeStyle = "#2B4C7E";
                ctx.lineWidth = 1.8;
                ctx.font = "16px 'Caveat', cursive";
                ctx.fillStyle = "#2B4C7E";

                // X-Axis
                if (origin.y >= 0 && origin.y <= height) {
                    ctx.beginPath();
                    // Slight organic curve offset to feel hand-drawn
                    ctx.moveTo(0, origin.y + 0.5);
                    ctx.quadraticCurveTo(width / 2, origin.y - 1, width, origin.y + 0.5);
                    ctx.stroke();

                    // X-Axis Arrow
                    ctx.beginPath();
                    ctx.moveTo(width - 12, origin.y - 5);
                    ctx.lineTo(width - 2, origin.y);
                    ctx.lineTo(width - 12, origin.y + 5);
                    ctx.stroke();

                    // Label 'x'
                    ctx.fillText("x", width - 18, origin.y - 10);
                }

                // Y-Axis
                if (origin.x >= 0 && origin.x <= width) {
                    ctx.beginPath();
                    ctx.moveTo(origin.x + 0.5, height);
                    ctx.quadraticCurveTo(origin.x - 1, height / 2, origin.x + 0.5, 0);
                    ctx.stroke();

                    // Y-Axis Arrow
                    ctx.beginPath();
                    ctx.moveTo(origin.x - 5, 12);
                    ctx.lineTo(origin.x, 2);
                    ctx.lineTo(origin.x + 5, 12);
                    ctx.stroke();

                    // Label 'y'
                    ctx.fillText("y", origin.x + 10, 18);
                }

                // Handwritten Tick Labels
                for (let x = firstX; x <= maxMathX; x += step) {
                    if (Math.abs(x) > 0.05) {
                        const pt = mathToScreen(x, 0);
                        const labelY = Math.max(25, Math.min(height - 15, origin.y + 18));
                        ctx.textAlign = "center";
                        ctx.fillText(x.toFixed(x % 1 === 0 ? 0 : 1), pt.x, labelY);
                    }
                }

                for (let y = firstY; y <= maxMathY; y += step) {
                    if (Math.abs(y) > 0.05) {
                        const pt = mathToScreen(0, y);
                        const labelX = Math.max(15, Math.min(width - 20, origin.x - 12));
                        ctx.textAlign = "right";
                        ctx.fillText(y.toFixed(y % 1 === 0 ? 0 : 1), labelX, pt.y + 4);
                    }
                }

                // Domain Boundary Vertical Dashed Lines
                ctx.strokeStyle = "rgba(232, 93, 117, 0.4)";
                ctx.setLineDash([4, 4]);

                const leftX = mathToScreen(-SQRT_3, 0).x;
                const rightX = mathToScreen(SQRT_3, 0).x;

                ctx.beginPath();
                ctx.moveTo(leftX, 0); ctx.lineTo(leftX, height);
                ctx.moveTo(rightX, 0); ctx.lineTo(rightX, height);
                ctx.stroke();

                ctx.restore();
            }

            // INK WAVEFORM DRAWING
            function drawInkWaveform() {
                ctx.save();

                const samples = Math.max(1000, Math.ceil(currentK * 18));
                const step = (2 * SQRT_3) / samples;

                ctx.beginPath();
                let first = true;

                for (let i = 0; i <= samples; i++) {
                    const x = -SQRT_3 + i * step;
                    const y = evaluateFunction(x, currentK);
                    const pt = mathToScreen(x, y);

                    if (first) {
                        ctx.moveTo(pt.x, pt.y);
                        first = false;
                    } else {
                        ctx.lineTo(pt.x, pt.y);
                    }
                }

                // Layer 1: Soft Fountain Pen Ink Under-Bleed
                ctx.strokeStyle = currentK > 20 ? "rgba(90, 64, 153, 0.35)" : "rgba(43, 76, 126, 0.25)";
                ctx.lineWidth = 4.5;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.stroke();

                // Layer 2: Core Rich Ink Stroke (Pink / Violet Accent for high K)
                ctx.strokeStyle = currentK > 30 ? "#E85D75" : "#2B4C7E";
                ctx.lineWidth = 2.0;
                ctx.stroke();

                ctx.restore();
            }

            // Run
            init();
        })();
    </script>
</body>
</html>
