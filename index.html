<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waveform | Notebook Visualization</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper-bg: #F7F3E8;
            --paper-line: rgba(140, 165, 195, 0.22);
            --margin-line: rgba(230, 110, 120, 0.35);
            --ink-main: #1C2434;
            --ink-blue: #2B4C7E;
            --ink-pink: #E84A7A;
            --ink-pink-highlight: #FF6B9A;
            --ink-purple: #5A4099;
            --ink-subtle: #7A8999;
            
            --font-hand: 'Caveat', cursive;
            --font-print-hand: 'Patrick Hand', cursive;
            --font-math: 'Lora', Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--paper-bg);
            color: var(--ink-main);
            font-family: var(--font-hand);
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* RULED NOTEBOOK PAPER BACKGROUND */
        .notebook-page {
            min-height: 100vh;
            width: 100%;
            position: relative;
            background-color: var(--paper-bg);
            background-image: 
                repeating-linear-gradient(
                    transparent,
                    transparent 29px,
                    var(--paper-line) 29px,
                    var(--paper-line) 30px
                );
            background-attachment: local;
            padding: 2.5rem 1.5rem 3rem 4.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NOISE TEXTURE OVERLAY */
        .notebook-page::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            opacity: 0.035;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* RED NOTEBOOK MARGIN LINE */
        .notebook-page::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3.5rem;
            width: 2px;
            background-color: var(--margin-line);
            pointer-events: none;
            z-index: 1;
        }

        /* MAIN CONTENT WRAPPER */
        .content-container {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* HEADER SECTION */
        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 1.5rem;
        }

        .title-group {
            position: relative;
            display: inline-block;
        }

        h1.notebook-title {
            font-family: var(--font-hand);
            font-size: 3.4rem;
            font-weight: 700;
            color: var(--ink-blue);
            line-height: 0.95;
            letter-spacing: 0.03em;
            transform: rotate(-0.8deg);
        }

        .notebook-subtitle {
            font-family: var(--font-print-hand);
            font-size: 1.25rem;
            color: var(--ink-subtle);
            margin-top: 0.2rem;
            margin-left: 0.2rem;
        }

        .title-underline {
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 105%;
            height: 10px;
            overflow: visible;
        }

        /* MATHEMATICAL EQUATION SECTION */
        .equation-area {
            text-align: center;
            margin-bottom: 1.2rem;
            position: relative;
        }

        .main-equation {
            font-family: var(--font-math);
            font-size: 1.9rem;
            color: var(--ink-main);
            margin-bottom: 0.2rem;
            letter-spacing: 0.01em;
        }

        .main-equation span.k-var {
            color: var(--ink-pink);
            font-weight: 600;
            font-style: italic;
            transition: color 0.3s ease;
        }

        .domain-note {
            font-family: var(--font-hand);
            font-size: 1.35rem;
            color: var(--ink-blue);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* GRAPH WRAPPER */
        .graph-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        canvas {
            display: block;
            background: transparent;
            cursor: grab;
            border-radius: 4px;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* SVG OVERLAY FOR ANNOTATIONS */
        .annotations-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .annotation {
            position: absolute;
            font-family: var(--font-hand);
            font-size: 1.3rem;
            color: var(--ink-blue);
            pointer-events: none;
            line-height: 1.1;
            white-space: nowrap;
        }

        .note-heart {
            top: 15px;
            left: 60px;
            transform: rotate(-3deg);
            color: var(--ink-purple);
        }

        .note-freq {
            top: 22px;
            right: 50px;
            transform: rotate(2deg);
            color: var(--ink-blue);
        }

        .note-waves {
            bottom: 45px;
            left: 40px;
            transform: rotate(-4deg);
            color: var(--ink-pink);
        }

        /* ANIMATED ECG HEARTBEAT LINE */
        .ecg-container {
            position: absolute;
            bottom: 22px;
            right: 45px;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ecg-svg {
            width: 130px;
            height: 30px;
            overflow: visible;
        }

        .ecg-path {
            stroke: var(--ink-pink);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 220;
            stroke-dashoffset: 220;
            animation: ecgDraw 3.8s ease-in-out infinite;
        }

        @keyframes ecgDraw {
            0% { stroke-dashoffset: 220; opacity: 0.2; }
            40% { stroke-dashoffset: 0; opacity: 1; }
            80% { stroke-dashoffset: -220; opacity: 1; }
            100% { stroke-dashoffset: -220; opacity: 0.2; }
        }

        /* CENTERED K INPUT & STATUS READOUT ONLY */
        .control-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
        }

        .k-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .k-input-row {
            font-family: var(--font-math);
            font-size: 1.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--ink-main);
        }

        .k-label {
            font-style: italic;
            color: var(--ink-pink);
            font-weight: 500;
        }

        .k-input {
            font-family: var(--font-print-hand);
            font-size: 1.85rem;
            color: var(--ink-blue);
            background: transparent;
            border: none;
            border-bottom: 2px dashed rgba(43, 76, 126, 0.4);
            outline: none;
            width: 110px;
            text-align: center;
            padding-bottom: 1px;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        .k-input:focus {
            border-bottom: 2px solid var(--ink-pink);
            color: var(--ink-pink);
        }

        .k-hint {
            font-family: var(--font-print-hand);
            font-size: 1.1rem;
            color: var(--ink-subtle);
            margin-top: 0.25rem;
        }

        /* STATUS SUMMARY NOTE */
        .status-summary {
            font-family: var(--font-print-hand);
            font-size: 1.15rem;
            color: var(--ink-subtle);
            text-align: center;
            line-height: 1.4;
            margin-top: 0.4rem;
        }

        .status-summary span {
            color: var(--ink-main);
        }

        /* FOOTER SIGNATURE */
        footer {
            margin-top: 3rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .signature {
            font-family: var(--font-hand);
            font-size: 1.15rem;
            color: rgba(122, 137, 153, 0.75);
            letter-spacing: 0.02em;
        }

        /* RESPONSIVE LAYOUT */
        @media (max-width: 768px) {
            .notebook-page {
                padding: 1.8rem 1rem 2.5rem 2.8rem;
            }
            .notebook-page::before {
                left: 2.1rem;
            }
            h1.notebook-title {
                font-size: 2.6rem;
            }
            .main-equation {
                font-size: 1.4rem;
            }
            .annotation {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="notebook-page">
        <div class="content-container">
            
            <header>
                <div class="title-group">
                    <h1 class="notebook-title">WAVEFORM</h1>
                    <svg class="title-underline" viewBox="0 0 200 10" preserveAspectRatio="none">
                        <path d="M 2,6 Q 50,1 100,7 T 198,4" fill="none" stroke="#2B4C7E" stroke-width="2.2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="notebook-subtitle">mathematical visualization</div>
            </header>

            <div class="equation-area">
                <div class="main-equation">
                    y = |x|²⁄³ + 0.9 sin(<span class="k-var" id="eqK">0</span>x) √(3 − x²)
                </div>
                <div class="domain-note">
                    domain: −√3 ≤ x ≤ √3
                </div>
            </div>

            <div class="graph-wrapper" id="graphWrapper">
                <canvas id="graphCanvas"></canvas>

                <svg class="annotations-svg" id="annotationsSvg">
                    <path d="M 160,32 Q 210,48 245,75" fill="none" stroke="#5A4099" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>
                    <path d="M 640,40 Q 610,65 570,95" fill="none" stroke="#2B4C7E" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
                    <path d="M 125,320 Q 155,305 190,320" fill="none" stroke="#E84A7A" stroke-width="1.6" marker-end="url(#arrow-pink)"/>

                    <defs>
                        <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#5A4099" />
                        </marker>
                        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2B4C7E" />
                        </marker>
                        <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                            <path d="M 0 1 L 10 5 L 0 9 z" fill="#E84A7A" />
                        </marker>
                    </defs>
                </svg>

                <div class="annotation note-heart">curious heart envelope</div>
                <div class="annotation note-freq">k controls frequency →</div>
                <div class="annotation note-waves">more k → more waves!</div>

                <div class="ecg-container">
                    <svg class="ecg-svg" viewBox="0 0 140 30">
                        <path class="ecg-path" d="M 5,15 L 35,15 L 42,5 L 48,25 L 55,10 L 62,20 L 67,15 L 135,15" />
                    </svg>
                </div>
            </div>

            <div class="control-section">
                <div class="k-input-group">
                    <div class="k-input-row">
                        <span class="k-label">k =</span>
                        <input type="text" id="kInput" class="k-input" value="0" autocomplete="off" spellcheck="false">
                    </div>
                    <div class="k-hint">Enter K value: 0–150</div>
                </div>

                <div class="status-summary">
                    k = <span id="readoutK">0.00</span> &nbsp;|&nbsp; 
                    domain: <span>[-1.732, 1.732]</span> &nbsp;|&nbsp; 
                    state: <span id="readoutState">ready</span>
                </div>
            </div>

            <footer>
                <div class="signature">© 2026 Created by Jalvant Vekariya</div>
            </footer>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM References
            const canvas = document.getElementById('graphCanvas');
            const ctx = canvas.getContext('2d');
            const graphWrapper = document.getElementById('graphWrapper');
            const kInput = document.getElementById('kInput');
            const eqK = document.getElementById('eqK');
            const readoutK = document.getElementById('readoutK');
            const readoutState = document.getElementById('readoutState');

            // Math Constants
            const SQRT_3 = Math.sqrt(3);
            const K_MIN = 0;
            const K_MAX = 150;

            // Interpolation State (2.5 Second Calm Fluid Easing)
            let currentK = 0.0;
            let targetK = 0.0;
            let startK = 0.0;
            let animStartTime = 0;
            const ANIM_DURATION = 2500; // 2.5 seconds

            // Viewport & Pan/Zoom
            const DEFAULT_PAN_X = 0.0;
            const DEFAULT_PAN_Y = 0.72;
            const DEFAULT_SCALE_X = 1.0;
            const DEFAULT_SCALE_Y = 1.0;

            let currentPanX = DEFAULT_PAN_X;
            let targetPanX = DEFAULT_PAN_X;
            let currentPanY = DEFAULT_PAN_Y;
            let targetPanY = DEFAULT_PAN_Y;

            let currentScaleX = DEFAULT_SCALE_X;
            let targetScaleX = DEFAULT_SCALE_X;
            let currentScaleY = DEFAULT_SCALE_Y;
            let targetScaleY = DEFAULT_SCALE_Y;

            let basePixelsPerUnit = 175;

            // Mouse Drag State
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            let panStartX = 0, panStartY = 0;

            function init() {
                setupEventListeners();
                handleResize();
                requestAnimationFrame(animationLoop);
            }

            function handleResize() {
                const rect = graphWrapper.getBoundingClientRect();
                const width = Math.min(rect.width, 820);
                const height = 430;

                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = `${width}px`;
                canvas.style.height = `${height}px`;

                ctx.scale(dpr, dpr);
                basePixelsPerUnit = Math.min(width, height) / 3.8;
            }

            function mathToScreen(x, y) {
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;
                const centerX = width / 2;
                const centerY = height / 2;

                const screenX = centerX + (x - currentPanX) * (basePixelsPerUnit * currentScaleX);
                const screenY = centerY - (y - currentPanY) * (basePixelsPerUnit * currentScaleY);
                return { x: screenX, y: screenY };
            }

            // EXACT MATHEMATICAL FUNCTION
            function evaluateY(x, k) {
                const absX = Math.abs(x);
                const term1 = Math.pow(absX, 2 / 3);
                const rad = Math.max(0, 3 - x * x);
                const term2 = 0.9 * Math.sin(k * x) * Math.sqrt(rad);
                return term1 + term2;
            }

            function setupEventListeners() {
                window.addEventListener('resize', handleResize);

                // Input handling
                kInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        applyTypedK();
                        kInput.blur();
                    }
                });

                kInput.addEventListener('blur', applyTypedK);

                // Pan Interaction
                canvas.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    panStartX = targetPanX;
                    panStartY = targetPanY;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - dragStartX;
                    const dy = e.clientY - dragStartY;
                    const unitX = basePixelsPerUnit * currentScaleX;
                    const unitY = basePixelsPerUnit * currentScaleY;

                    targetPanX = panStartX - dx / unitX;
                    targetPanY = panStartY + dy / unitY;
                });

                window.addEventListener('mouseup', () => { isDragging = false; });

                // Zoom Interaction
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const factor = e.deltaY < 0 ? 1.08 : 0.92;
                    targetScaleX = Math.max(0.4, Math.min(8, targetScaleX * factor));
                    targetScaleY = Math.max(0.4, Math.min(8, targetScaleY * factor));
                }, { passive: false });
            }

            function applyTypedK() {
                let parsed = parseFloat(kInput.value);
                if (isNaN(parsed) || !isFinite(parsed)) {
                    parsed = targetK;
                }
                parsed = Math.max(K_MIN, Math.min(K_MAX, parsed));
                if (parsed !== targetK) {
                    startK = currentK;
                    targetK = parsed;
                    animStartTime = performance.now();
                }
            }

            function formatDisplayNum(num) {
                if (Math.abs(num - Math.round(num)) < 0.001) {
                    return Math.round(num).toString();
                }
                return num.toFixed(2);
            }

            // MAIN ANIMATION LOOP
            function animationLoop() {
                updateState();
                renderCanvas();
                requestAnimationFrame(animationLoop);
            }

            function updateState() {
                // Smooth, Steady, Fluid Cubic Interpolation over 2.5s (No overshoot/bounce)
                if (currentK !== targetK) {
                    const elapsed = performance.now() - animStartTime;
                    const progress = Math.min(1, Math.max(0, elapsed / ANIM_DURATION));
                    
                    // Ease Out Cubic: 1 - (1 - t)^3
                    const ease = 1 - Math.pow(1 - progress, 3);
                    currentK = startK + (targetK - startK) * ease;

                    if (progress >= 1) {
                        currentK = targetK;
                    }
                }

                // Smooth Viewport Interpolation
                currentPanX += (targetPanX - currentPanX) * 0.1;
                currentPanY += (targetPanY - currentPanY) * 0.1;
                currentScaleX += (targetScaleX - currentScaleX) * 0.1;
                currentScaleY += (targetScaleY - currentScaleY) * 0.1;

                // Sync UI Displays
                const formattedStr = formatDisplayNum(currentK);
                eqK.textContent = formattedStr;
                readoutK.textContent = currentK.toFixed(2);

                if (document.activeElement !== kInput) {
                    kInput.value = formattedStr;
                }

                // Determine State Label
                if (Math.abs(targetK - currentK) > 0.01) {
                    readoutState.textContent = 'morphing';
                } else {
                    readoutState.textContent = currentK === 0 ? 'ready' : 'stable';
                }
            }

            function renderCanvas() {
                const width = canvas.offsetWidth;
                const height = canvas.offsetHeight;

                ctx.clearRect(0, 0, width, height);

                drawGridAndAxes(width, height);
                drawWaveformCurve();
            }

            // ORGANIC NOTEBOOK AXES & GRID
            function drawGridAndAxes(width, height) {
                ctx.save();

                const pxPerUnitX = basePixelsPerUnit * currentScaleX;
                const pxPerUnitY = basePixelsPerUnit * currentScaleY;

                const minMathX = currentPanX - (width / 2) / pxPerUnitX;
                const maxMathX = currentPanX + (width / 2) / pxPerUnitX;
                const minMathY = currentPanY - (height / 2) / pxPerUnitY;
                const maxMathY = currentPanY + (height / 2) / pxPerUnitY;

                let step = 0.5;
                if (pxPerUnitX < 75) step = 1.0;

                // Very faint pencil grid lines
                ctx.strokeStyle = "rgba(43, 76, 126, 0.06)";
                ctx.lineWidth = 1;

                const firstX = Math.floor(minMathX / step) * step;
                for (let x = firstX; x <= maxMathX; x += step) {
                    const pt = mathToScreen(x, 0);
                    ctx.beginPath();
                    ctx.moveTo(pt.x, 0); ctx.lineTo(pt.x, height);
                    ctx.stroke();
                }

                const firstY = Math.floor(minMathY / step) * step;
                for (let y = firstY; y <= maxMathY; y += step) {
                    const pt = mathToScreen(0, y);
                    ctx.beginPath();
                    ctx.moveTo(0, pt.y); ctx.lineTo(width, pt.y);
                    ctx.stroke();
                }

                // Main Axes (Soft Hand-Drawn Ink Lines)
                const origin = mathToScreen(0, 0);
                ctx.strokeStyle = "#2B4C7E";
                ctx.lineWidth = 1.7;
                ctx.font = "16px 'Caveat', cursive";
                ctx.fillStyle = "#2B4C7E";

                // Horizontal Axis
                if (origin.y >= -20 && origin.y <= height + 20) {
                    ctx.beginPath();
                    ctx.moveTo(0, origin.y + 0.5);
                    ctx.quadraticCurveTo(width * 0.5, origin.y - 0.8, width, origin.y + 0.5);
                    ctx.stroke();

                    // Arrow
                    ctx.beginPath();
                    ctx.moveTo(width - 12, origin.y - 4);
                    ctx.lineTo(width - 2, origin.y);
                    ctx.lineTo(width - 12, origin.y + 4);
                    ctx.stroke();

                    ctx.fillText("x", width - 16, origin.y - 9);
                }

                // Vertical Axis
                if (origin.x >= -20 && origin.x <= width + 20) {
                    ctx.beginPath();
                    ctx.moveTo(origin.x + 0.5, height);
                    ctx.quadraticCurveTo(origin.x - 0.8, height * 0.5, origin.x + 0.5, 0);
                    ctx.stroke();

                    // Arrow
                    ctx.beginPath();
                    ctx.moveTo(origin.x - 4, 12);
                    ctx.lineTo(origin.x, 2);
                    ctx.lineTo(origin.x + 4, 12);
                    ctx.stroke();

                    ctx.fillText("y", origin.x + 10, 16);
                }

                // Axis Tick Numerical Labels
                for (let x = firstX; x <= maxMathX; x += step) {
                    if (Math.abs(x) > 0.05) {
                        const pt = mathToScreen(x, 0);
                        const labelY = Math.max(22, Math.min(height - 10, origin.y + 18));
                        ctx.textAlign = "center";
                        ctx.fillText(x.toFixed(x % 1 === 0 ? 0 : 1), pt.x, labelY);
                    }
                }

                for (let y = firstY; y <= maxMathY; y += step) {
                    if (Math.abs(y) > 0.05) {
                        const pt = mathToScreen(0, y);
                        const labelX = Math.max(12, Math.min(width - 18, origin.x - 10));
                        ctx.textAlign = "right";
                        ctx.fillText(y.toFixed(y % 1 === 0 ? 0 : 1), labelX, pt.y + 4);
                    }
                }

                // Domain Limit Vertical Dashed Lines (−√3 and √3)
                ctx.strokeStyle = "rgba(232, 74, 122, 0.38)";
                ctx.setLineDash([4, 4]);

                const leftBoundaryX = mathToScreen(-SQRT_3, 0).x;
                const rightBoundaryX = mathToScreen(SQRT_3, 0).x;

                ctx.beginPath();
                ctx.moveTo(leftBoundaryX, 0); ctx.lineTo(leftBoundaryX, height);
                ctx.moveTo(rightBoundaryX, 0); ctx.lineTo(rightBoundaryX, height);
                ctx.stroke();

                ctx.restore();
            }

            // ACCURATE PINK HEART WAVEFORM RENDERING
            function drawWaveformCurve() {
                ctx.save();

                // Adaptive sampling to maintain resolution at high K
                const sampleCount = Math.max(1200, Math.ceil(currentK * 20));
                const step = (2 * SQRT_3) / sampleCount;

                ctx.beginPath();
                let started = false;

                for (let i = 0; i <= sampleCount; i++) {
                    const x = -SQRT_3 + i * step;
                    const y = evaluateY(x, currentK);
                    const pt = mathToScreen(x, y);

                    if (!started) {
                        ctx.moveTo(pt.x, pt.y);
                        started = true;
                    } else {
                        ctx.lineTo(pt.x, pt.y);
                    }
                }

                // Layer 1: Soft Pink Outer Bleed Glow (#FF6B9A)
                ctx.strokeStyle = "rgba(255, 107, 154, 0.28)";
                ctx.lineWidth = 4.5;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.stroke();

                // Layer 2: Main Fountain Pen Core Line - Beautiful Ink Pink (#E84A7A)
                ctx.strokeStyle = "#E84A7A";
                ctx.lineWidth = 2.0;
                ctx.stroke();

                ctx.restore();
            }

            // Start system
            init();
        })();
    </script>
</body>
</html>
